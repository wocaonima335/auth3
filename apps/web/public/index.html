<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auth Phase3 控制面</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="topbar-left">
        <h1>Phase3 控制面</h1>
        <span class="badge" id="workerStatus">connecting</span>
      </div>
      <div class="topbar-right">
        <span id="sessionInfo" class="session-info"></span>
        <button id="logoutBtn" class="btn-ghost btn-sm hidden">退出</button>
        <label class="api-toggle" id="apiToggle">API</label>
        <div class="api-popup hidden" id="apiPopup">
          <input id="apiBase" placeholder="http://host:3080">
          <button id="saveApiBase">保存</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 id="jobsTitle">任务列表</h2>
          <button id="createJobBtn" class="btn-icon" title="新建任务">+</button>
        </div>
        <div id="jobsList" class="job-list"></div>
      </aside>

      <section class="main-area">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📋</div>
          <p>选择左侧任务查看详情，或点击 + 创建新任务</p>
        </div>

        <div id="jobDetail" class="detail-panel hidden">
          <div class="detail-header">
            <div>
              <span class="status" id="detailStatus">—</span>
              <h2 id="detailEmail">—</h2>
            </div>
            <div class="detail-actions" id="detailActions"></div>
          </div>
          <div class="detail-meta" id="detailMeta"></div>
          <div class="log-container">
            <div class="log-header">
              <h3>实时日志</h3>
              <label class="auto-scroll-label">
                <input type="checkbox" id="autoScroll" checked> 自动滚动
              </label>
            </div>
            <div class="log-body" id="logBody"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- 创建任务弹窗 -->
    <div class="modal-overlay hidden" id="createModal">
      <div class="modal">
        <div class="modal-header">
          <h2>创建 Phase3 任务</h2>
          <button class="btn-icon modal-close" id="closeModal">&times;</button>
        </div>
        <form id="createForm" class="modal-body">
          <label for="emailInput">邮箱地址</label>
          <input id="emailInput" type="email" placeholder="user@example.com" required>
          <div id="accountPreview" class="account-preview hidden"></div>
          <div class="modal-footer">
            <button type="button" class="btn-ghost" id="cancelModal">取消</button>
            <button type="submit" class="btn-primary" id="submitJob">创建任务</button>
          </div>
        </form>
      </div>
    </div>

    <!-- 管理员登录弹窗 -->
    <div class="modal-overlay hidden" id="adminModal">
      <div class="modal">
        <div class="modal-header">
          <h2>管理员登录</h2>
          <button class="btn-icon modal-close" id="closeAdminModal">&times;</button>
        </div>
        <form id="adminLoginForm" class="modal-body">
          <label for="adminUsername">管理员账号</label>
          <input id="adminUsername" value="admin" autocomplete="username">
          <label for="adminPassword">管理员密码</label>
          <input id="adminPassword" type="password" autocomplete="current-password">
          <div class="modal-footer">
            <button type="button" class="btn-ghost" id="cancelAdmin">取消</button>
            <button type="submit" class="btn-primary">登录</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
